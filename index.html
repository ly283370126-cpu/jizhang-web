<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="robots" content="noindex, nofollow">
<title>记账</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <span class="brand">记录</span>
  <button id="settingsBtn" class="icon-btn" type="button" aria-label="设置">设置</button>
</header>

<main>
  <section class="summary" id="summary"></section>

  <nav class="tabs" id="tabs">
    <button class="tab is-on" data-range="today" type="button">今天</button>
    <button class="tab" data-range="current_month" type="button">本月</button>
    <button class="tab" data-range="last_7_days" type="button">近 7 天</button>
  </nav>

  <section id="answer" class="answer" hidden></section>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty">还没有账。说一句就行 —— 「早饭 12」。</p>
</main>

<div class="composer">
  <div class="chips" id="chips">
    <button type="button" data-q="今天花了多少">今天花了多少</button>
    <button type="button" data-q="本月超过200元的账单">本月超过 200 的</button>
    <button type="button" data-q="这个月预算还剩多少">预算还剩多少</button>
  </div>
  <form id="form" autocomplete="off">
    <input id="input" type="text" inputmode="text" enterkeyhint="send"
           placeholder="说一句，比如「打车 25」" aria-label="记一笔">
    <button type="submit" id="sendBtn">记下</button>
  </form>
</div>

<div id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></div>
<div id="toast" class="toast" hidden></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
