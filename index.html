<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="robots" content="noindex, nofollow">
<title>记账</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-inner">
    <h2 class="drawer-title">我的小账本</h2>
    <button class="menu-item" type="button" data-act="budget">预算管理</button>
    <button class="menu-item" type="button" data-act="compose">记一笔 / 查账</button>
    <div class="menu-block">
      <button class="menu-item" type="button" data-act="stats">图表统计</button>
      <button class="menu-item" type="button" data-act="export">导出数据</button>
      <button class="menu-item" type="button" data-act="learn">常用商户</button>
      <button class="menu-item" type="button" data-act="ledger">账本管理</button>
    </div>
    <button class="menu-item" type="button" data-act="settings">设置</button>
    <button class="menu-item" type="button" data-act="about">关于</button>
    <button class="menu-item danger" type="button" data-act="clear">清空数据</button>
    <div class="drawer-stats" id="statCard"></div>
    <p class="drawer-note">账单保存在此设备 · 不上传服务器</p>
  </div>
</aside>

<header class="topbar">
  <button class="icon-plain" id="menuBtn" type="button" aria-label="菜单">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <h1>记录</h1>
  <button class="ledger-btn" id="ledgerPill" type="button">我的账本</button>
</header>

<main>
  <div class="search">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" placeholder="搜索备注或商户" aria-label="搜索备注或商户">
  </div>

  <section class="card" id="budgetCard"></section>
  <section class="card balance" id="assetCard"></section>

  <div class="section-head">
    <h2>记录明细</h2>
    <button class="icon-soft" id="statsBtn" type="button" aria-label="图表统计">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="groups"></div>
  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" width="42" height="42" aria-hidden="true"><path d="M5 4.5h11a2 2 0 012 2v13H7a2 2 0 01-2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 4.5v15M18 19.5h1A1 1 0 0020 18V6a1 1 0 00-1-1h-1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <div class="empty-title">还没有账单</div>
    <div class="empty-sub">在底部输入一笔消费，确认后就会出现在这里。</div>
  </div>
</main>

<div class="composer">
  <div class="suggests" id="suggests" hidden>
    <button type="button" data-q="今天花了多少？">今天花了多少？</button>
    <button type="button" data-q="本月超过 200 元的账单">本月超过 200 元的账单</button>
    <button type="button" data-q="本周支出最高的一笔是什么？">本周支出最高的一笔是什么？</button>
  </div>
  <form class="askbar" id="form" autocomplete="off">
    <span class="sparkle" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" fill="#3366E6"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="#9FB4F2"/></svg>
    </span>
    <input id="input" type="text" enterkeyhint="send" placeholder="任何事情都可以问我" aria-label="记一笔或问一句">
    <button class="plus" id="plusBtn" type="button" aria-label="打开记账">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="send" id="sendBtn" type="submit" aria-label="识别输入">
      <svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 17V7.6M12 7.4l-3.4 3.4M12 7.4l3.4 3.4" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
</div>

<div id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></div>
<div id="toast" class="toast" hidden></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
